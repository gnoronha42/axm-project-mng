server {
  listen 80;
  server_name _;
  absolute_redirect off;
  client_max_body_size 50m;

  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location = /axm-config.js {
    expires -1;
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location ~* ^/app/assets/.*\.(css|js|png|jpg|jpeg|svg|webp|avif|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* ^/assets/.*\.(css|js|png|jpg|jpeg|svg|webp|avif|woff2)$ {
    expires -1;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /app {
    return 308 /app/;
  }

  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  location = /login {
    return 308 /app/login;
  }

  location = /register {
    return 308 /app/register;
  }

  location ~ ^/(projects|fluxo|documents|fiscal|conformidade|biblioteca|rd|perfil|equipe)(/.*)?$ {
    return 308 /app$request_uri;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
